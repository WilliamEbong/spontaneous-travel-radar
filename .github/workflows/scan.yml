name: scan
# Daily collector + Pages deploy. A push that touches the dashboard or the digests only redeploys Pages (no scan).
on:
  schedule:
    - cron: "17 10 * * *"   # 03:17 MST / 04:17 MDT; a full scan takes about 80 min, done before the Monday 07:00 digest
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated city keys (blank = all 20)"
        required: false
        default: ""
      budget:
        description: "Max Google Flights fetch attempts"
        required: false
        default: "900"
  push:
    branches: [main]
    paths: ["index.html", "site/**", "data/digests/**"]   # the daily routine's note shows up the same morning

concurrency:   # Pages-only pushes get their own queue so they never cancel a waiting scan
  group: ${{ github.event_name == 'push' && 'pages' || 'scan' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, so a queued Pages-only run still ships the newest scan data
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: github.event_name != 'push'
        run: pip install -e .
      - name: Scan
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PYTHONTZPATH: ""   # use the pip tzdata package (Alberta/BC rule changes), not the runner's older zone files
          CITIES: ${{ inputs.cities }}
          BUDGET: ${{ inputs.budget }}
        run: |
          python -m radar.main scan --budget "${BUDGET:-900}" ${CITIES:+--cities "$CITIES"}
          python -c "import json; h=json.load(open('data/latest.json'))['health']; h.pop('fetch_errors'); print(h)"
      - name: Commit data
        if: always() && github.event_name != 'push'   # keep the SerpApi counter even if the scan failed
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data hits
          git commit -m "chore: data scan $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - name: Drop the fetch cache from the site
        run: rm -rf data/cache
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
