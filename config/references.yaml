# Route ladders: what each city normally costs, so a deal is judged against its own route (v2, D-57).
# flights: CAD per person, round trip, carry-on included, any fare family (basic allowed). From
#   docs/research/2026-11-09-fare-references.md (Google Flights typical floors, YYC Deals posts).
# rooms: per night, before tax, in the city's hotel_currency (cities.yaml), for a 4-5 star room rated
#   4.3+ in the listed neighbourhoods. winter = check-in Nov to Mar, summer = Apr to Oct.
#   source: research (Vancouver winter), google-hotels <date> (scripts/room_references.py), or estimate
#   (the old v1 hotel tiers, summer +30%) until that script has run for the city.
# confidence: how solid the flight ladder is. nonstop: year-round | seasonal | none (from YYC).
# Loader rule: exceptional < good < typical for every ladder, and every city in cities.yaml is here.

new_york:
  confidence: high
  nonstop: year-round
  flights: {typical: 650, good: 420, exceptional: 320}
  rooms:
    winter: {typical: 330, good: 250, exceptional: 190, source: estimate}
    summer: {typical: 430, good: 325, exceptional: 245, source: estimate}

