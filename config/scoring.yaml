mode: dry-run            # dry-run | live. Month one stays dry-run: nothing is emailed, hits and near misses show on the page.
usd_cad: 1.40            # the only currency conversion in the system
dayoff_min_weeks: 6      # Settings panel: day-off trips start at least N weeks out (2-12), so both of you can get the time approved
cap_cad: null            # Settings panel: optional cap on a hit's complete trip for two, CAD; null = off (v2: no budgets in scoring)
realert_drop_pct: 15     # a city-window gets a fresh closer look (pass 2) only after its fare drops this much more
serpapi_monthly_cap: 200 # free tier is 250/month; pass 2 spends 2 per candidate (hotels + rentals), at most 3 candidates a scan
weights: {price: 45, time: 20, convenience: 10, city: 15, weather: 10}
price_curve:             # price points vs share = complete trip for two / the route's typical trip (v2, D-57)
  points: [[0.60, 45], [0.75, 25], [1.00, 0], [1.30, -10]]   # straight lines between; full points at or under 0.60
  floor: -40             # past 1.30 the line keeps its slope down to this, so the cheaper of two dear trips still wins (D-59)
time_curve:              # time score vs share of the window's best possible waking hours (D-51)
  zero_at: 0.10          # 0 points here; trips below it are dropped as not worth flying
  full_at: 0.70          # full points here (real trips top out near 0.70-0.75: flights eat the rest)
trip_classes:            # D-52. Window ranges and hard rules are William's; thresholds are tunable (v2: 70 to look closer, 80 to hit)
  dayoff:                # fri-off, mon-off and stat blocks; Day 1 from dayoff_min_weeks to + span_weeks out
    enabled: true        # Settings panel
    candidate_threshold: 70   # pass-1 score (with fare at or under the route's good) that earns pass 2
    hit_threshold: 80    # Settings panel: final score (pass 2 + what's on) for a hit
    span_weeks: 10
    rotate_days: 3       # each city-weekend is scanned every 3rd day (crc32 rotation)
  weekend:               # leave Friday after work, home Sunday; no day off needed
    enabled: true        # Settings panel
    candidate_threshold: 70
    hit_threshold: 80    # Settings panel
    min_days: 3          # Friday at least this many days out
    max_days: 42
    depart_from: "17:30" # Friday (reading of "leave friday after work")
    depart_to: "12:00"   # Saturday
    max_air_min: 180     # non-stop only, 3 h or less in the air (cities.yaml air_time_min)
