# The 20 tracked cities (design section 5). Edit freely; the loader validates every field.
# Route ladders (typical, good and exceptional fares and room rates) live in config/references.yaml.
# hotel_tax: room taxes and fees as a factor on the pre-tax rate; optional, defaults 1.15 CA, 1.16 US, 1.19 MX.
# climate: month -> [mean high C, mean low C, days with precipitation]; approximate 1991-2020 normals, seeds only.
# airports: the first is the preferred (usually non-stop) airport; the rest are queried on alternating days.
# season_months: empty = year-round. BNA, AUS and SAN routes are likely seasonal (health flags no non-stop found).
