[project]
name = "radar"
version = "0.1.0"
description = "Spontaneous Travel Radar: daily weekend-trip fare collector from Calgary (YYC)"
requires-python = ">=3.12"
dependencies = [
    "fast-flights==3.1.0",
    "typing-extensions",  # fast-flights 3.1.0 imports it without declaring it
    "pyyaml>=6",
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
